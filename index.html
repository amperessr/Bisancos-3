<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffd0e2">
<title>愛心接接樂 — Bisancos 七夕遊戲</title>
<link rel="stylesheet" href="shared/common.css">
</head>
<body>

<div id="stage">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="hud-stats">
      <span class="chip">⭐ <span id="score">0</span></span>
      <span class="chip">❤️ <span id="lives">10</span></span>
      <span class="chip">⏱ <span id="time">60</span></span>
    </div>
    <button class="chip mute-btn" id="mute" aria-label="靜音切換">🔊</button>
  </div>

  <!-- 開始畫面 -->
  <div class="overlay" id="menu">
    <div class="eyebrow">BISANCOS</div>
    <div class="title">🧺 愛心接接樂</div>
    <div class="divider"></div>
    <div class="rules">
      💗 愛心 <b>+10</b>　🌹 玫瑰 <b>+20</b><br>
      🎁 禮物 <b>+30</b><br>
      💔 破碎愛心 <b>-10</b>　💣 炸彈 <b>-20</b><br>
      ❤️ 接到扣分物品會 <b>-1 條命</b>，剩 10 條命<br>
      <span style="color:#8a6b78">左右滑動移動籃子，限時 60 秒</span>
    </div>
    <input type="text" id="name" maxlength="10" placeholder="輸入UID/暱稱">
    <button class="btn" id="start">開始遊戲</button>
  </div>

  <!-- 結算畫面 -->
  <div class="overlay hidden" id="over">
    <div class="eyebrow">BISANCOS</div>
    <div class="subtitle" id="over-reason">本局得分</div>
    <div class="big-score" id="final-score">0</div>
    <div class="subtitle" id="final-detail"></div>
    <div class="board" id="board"></div>
    <button class="btn" id="again">再玩一次</button>
  </div>
</div>

<script src="shared/config.js"></script>
<script src="shared/leaderboard.js"></script>
<script src="shared/audio.js"></script>
<script src="game.js"></script>
</body>
</html>
